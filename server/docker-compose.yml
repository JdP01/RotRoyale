services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Added port mapping for debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 5

  nakama:
    env_file:
      - ./.env
    build: 
      context: .
    depends_on: 
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "7350:7350"
      - "7351:7351"     # console
      - "7352:7352"     # runtime HTTP (see step 3) new suggestion by chat 

volumes:
  pgdata:
