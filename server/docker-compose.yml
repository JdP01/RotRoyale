services:
  postgres:
    image: postgres:13
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakama} -d ${POSTGRES_DB:-nakama}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  nakama:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: dockerfile
    depends_on: 
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "7350"
      - "7351"
      - "7352"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    networks:
      - internal
      - web-gateway

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  web-gateway:
    external: true
