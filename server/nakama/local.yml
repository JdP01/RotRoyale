name: "nakama"

logger:
  level: "DEBUG"

database:
  connection: "postgres" 
  dsn: "postgresql://nakama:localdb@postgres:5432/nakama?sslmode=disable"

console:
  username: "juandi"
  password: "Arco2004"
  http_bind_address: "0.0.0.0"

session:
  encryption_key: "averyrandomlongstringvalue1"
  refresh_encryption_key: "anotherrandomlongstringvalue2"

socket:
  server_key: "defaultkey"
  bind_address: "0.0.0.0"
  port: 7350

runtime:
  http_key: "defaultkey"
  http_bind_address: "0.0.0.0"
  port: 7351

# Add HTTP server configuration with CORS
http_server:
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Requested-With"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"

# Matchmaker configuration
matchmaker:
  revthreshold: 100
  revupperbound: 2000
  revmultiplier: 1
  intervalms: 15000
  maxtickets: 1000