name: "nakama"

logger:
  level: "DEBUG"

database:
  connection: "postgres" 
  dsn: "postgresql://nakama:localdb@postgres:5432/nakama?sslmode=disable"

console:
  username: ${CONSOLE_USERNAME}
  password: ${CONSOLE_PASSWORD} #works with hardcoded values but not with .env variables 
  http_bind_address: "0.0.0.0"

session:
  encryption_key: "averyrandomlongstringvalue1"
  refresh_encryption_key: "anotherrandomlongstringvalue2"

socket:
  server_key: "defaultkey"
  bind_address: "0.0.0.0"
  port: 7350

runtime:
  http_key: "defaultkey"
  http_bind_address: "0.0.0.0"
  port: 7352

# Add HTTP server configuration with CORS
http_server:
  allowed_origins: ${ALLOWED_ORIGINS}
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Requested-With"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"

# Matchmaker configuration
matchmaker:
  revthreshold: 100
  revupperbound: 2000
  revmultiplier: 1
  intervalms: 15000
  maxtickets: 1000